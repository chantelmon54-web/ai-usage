<title>AI 사용량 현황판</title>
<!--
  AI 사용량 현황판 — 정적 페이지 한 장 (PLAN.md §5-5 D8)
  - 숫자는 Apps Script 웹앱의 ?format=json 에서 **쿠키 없이** 받아 온다.
    ★사람이 script.google.com 을 직접 열면 구글 다계정 브라우저에서 /u/N/ 으로 돌려져
      404 가 난다(원인 = 브라우저가 실어 보내는 구글 쿠키). 구글 밖 페이지가
      credentials:'omit' 으로 부르면 계정 수와 무관하게 열린다(2026-09-19 실측).
  - 외부 라이브러리 0, 비밀값 0. 공개 JSON 에는 이메일이 없다(Code.gs 화이트리스트).
  - 화면 원본은 ui/usage-ui.css·js. build_ui.py로 허브·보고 화면과 함께 생성한다.
  - 페이지 디자인을 고칠 때만 다시 올린다. 숫자는 저절로 바뀐다.
-->
<style>
/* BEGIN AI_USAGE_CSS */
/* 공통 화면 원본. 허브 안에서는 기존 --hub-* 테마를 상속합니다. */
body.aiu-page{--hub-bg:#e9dfcd;--hub-surface:#faefe0;--hub-surface-2:#f1e5d6;--hub-surface-3:#e5d9c4;
--hub-border:#d1c9be;--hub-border-strong:#b9aea1;--hub-text:#2f2a27;--hub-strong:#1f1c1a;
--hub-muted:#6d645d;--hub-accent:#3f756f;--hub-good:#4c8752;--hub-bad:#c74e40;--hub-bad-ink:#993228;
color-scheme:light;margin:0;padding:28px 20px;background:var(--hub-bg);color:var(--hub-text);
font:14px/1.5 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;-webkit-font-smoothing:antialiased}
body.aiu-page.dark{color-scheme:dark;--hub-bg:#1d2021;--hub-surface:#282828;--hub-surface-2:#2f3231;
--hub-surface-3:#373a39;--hub-border:#3b3f3e;--hub-border-strong:#4a4f4d;--hub-text:#ebdbb2;
--hub-strong:#fbf1c7;--hub-muted:#d5c4a1;--hub-accent:#83a598;--hub-good:#7db57d;--hub-bad:#e25c49;--hub-bad-ink:#ee7c6b}
.aiu-page .wrap{max-width:1080px;margin:0 auto}
.aiu-view{color:var(--hub-text);font:14px/1.5 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;min-width:0}
.aiu-view,.aiu-view *{box-sizing:border-box}
.aiu-view .aiu-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:28px}
.aiu-view .aiu-top h1{margin:0 0 6px;font-size:23px;letter-spacing:-.7px;line-height:1.35;color:var(--hub-strong)}
.aiu-view .aiu-meta{color:var(--hub-muted);font-size:12px}
.aiu-view .aiu-theme-button{font:inherit;font-size:12px;color:var(--hub-text);background:var(--hub-surface);
border:1px solid var(--hub-border);border-radius:10px;padding:8px 14px;min-height:44px;flex-shrink:0;cursor:pointer}
.aiu-view .aiu-section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 12px}
.aiu-view .aiu-section-head h2{font-size:15px;margin:0;font-weight:700;color:var(--hub-text)}
.aiu-view .aiu-section-head>span{font-size:11px;color:var(--hub-muted)}
.aiu-view .aiu-groups{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.aiu-view .aiu-account{min-width:0;background:var(--hub-surface);border:1px solid var(--hub-border-strong);border-radius:14px;overflow:hidden}
.aiu-view .aiu-account-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:13px 18px;background:var(--hub-surface-2);border-bottom:1px solid var(--hub-border)}
.aiu-view .aiu-account-head h3{margin:0;font-size:15px;font-weight:700;color:var(--hub-strong)}
.aiu-view .aiu-account-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.aiu-view .aiu-card{min-width:0;padding:18px}
.aiu-view .aiu-card+.aiu-card{border-left:1px solid var(--hub-border)}
.aiu-view .aiu-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px;flex-wrap:wrap}
.aiu-view .aiu-card h4{font-size:15px;font-weight:700;line-height:1.4;margin:0;color:var(--hub-text)}
.aiu-view .aiu-plan{font-size:11px;color:var(--hub-muted)}
.aiu-view .aiu-owner{color:var(--hub-muted);font-size:12px;overflow-wrap:anywhere}
.aiu-view .aiu-primary{margin-top:22px}
.aiu-view .aiu-limit-head{display:flex;justify-content:space-between;gap:5px;align-items:baseline;flex-wrap:wrap;font-size:12px}
.aiu-view .aiu-status{font-size:11px;color:var(--hub-bad-ink)}
.aiu-view .aiu-state-unknown .aiu-status{color:var(--hub-muted)}

.aiu-view .aiu-track i{display:block;height:100%;background:var(--hub-accent);border-radius:inherit}
.aiu-view .aiu-state-crit .aiu-track i{background:var(--hub-bad)}
.aiu-view .aiu-state-crit .aiu-value,.aiu-view .aiu-state-crit .aiu-small-value{color:var(--hub-bad-ink)}
.aiu-view .aiu-reset{color:var(--hub-muted);font-size:11px;margin-top:7px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.aiu-view .aiu-other-limits{border-top:1px solid var(--hub-border);margin-top:18px;padding-top:13px;display:grid;gap:12px}
.aiu-view .aiu-small-value{font-weight:700;font-variant-numeric:tabular-nums}
.aiu-view .aiu-secondary .aiu-track{height:4px;margin-top:6px}
.aiu-view .aiu-secondary .aiu-reset{margin-top:5px}
.aiu-view .aiu-legend{font-size:11px;color:var(--hub-muted);margin:10px 0 24px}
.aiu-view .aiu-err,.aiu-view .aiu-stale,.aiu-view .aiu-fail{font-size:12px;color:var(--hub-bad-ink);overflow-wrap:anywhere}
.aiu-view .aiu-stale{margin:12px 0 0}
.aiu-view .aiu-fail{margin-top:5px}
.aiu-view .aiu-lag{color:var(--hub-bad-ink);margin-left:8px;font-weight:700}
.aiu-view .aiu-missing{font-size:42px;color:var(--hub-muted);margin:20px 0 6px}
.aiu-view .aiu-empty{color:var(--hub-muted);font-size:12px}
.aiu-view .aiu-trend{border-top:1px solid var(--hub-border);padding-top:4px}
.aiu-view .aiu-trend summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 0;min-height:60px;cursor:pointer}
.aiu-view .aiu-trend summary::-webkit-details-marker{display:none}
.aiu-view .aiu-trend summary strong{font-size:15px;display:block}
.aiu-view .aiu-trend summary small{font-size:12px;color:var(--hub-muted);display:block;margin-top:3px}
.aiu-view .aiu-expand{font-size:12px;color:var(--hub-muted)}
.aiu-view .aiu-expand:after{content:'펼치기'}
.aiu-view .aiu-trend[open] .aiu-expand:after{content:'접기'}
.aiu-view .aiu-trend-empty{padding:28px 16px;text-align:center;background:var(--hub-surface-2);border-radius:12px;color:var(--hub-muted)}
.aiu-view .aiu-trend-empty strong{font-size:14px;font-weight:500;color:var(--hub-text)}
.aiu-view .aiu-trend-empty p{font-size:12px;margin:7px 0 12px}
.aiu-view .aiu-trend-empty>span{font-size:11px}
.aiu-view .aiu-footer{font-size:11px;color:var(--hub-muted);margin-top:22px;line-height:1.7}
.aiu-view .aiu-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:1000px){.aiu-view .aiu-groups{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){body.aiu-page{padding:20px 14px}.aiu-view .aiu-groups{gap:14px}.aiu-view .aiu-account-head{padding:11px 13px}.aiu-view .aiu-card{padding:13px}.aiu-view .aiu-value{font-size:38px}.aiu-view .aiu-primary{margin-top:18px}.aiu-view .aiu-top{margin-bottom:22px}}
/* END AI_USAGE_CSS */
</style>
</head>
<body class="aiu-page">
<script>
// body 가 열리자마자 저장된 테마를 입힌다(깜빡임 방지).
(function(){try{if(localStorage.getItem('aiUsageTheme')==='dark'){document.body.classList.add('dark');}}catch(e){}})();
</script>
<div class="wrap"><main class="aiu-view">
  <div class="aiu-top">
    <div>
      <h1>AI 사용량</h1>
      <div class="aiu-meta" id="meta">불러오는 중…</div>
      <div class="aiu-fail" id="fail" hidden></div>
    </div>
    <button id="tbtn" class="aiu-theme-button" type="button" onclick="tg()">다크</button>
  </div>
  <div id="groups"></div>
  <footer class="aiu-footer">구독 한도 사용률입니다. 조회 자체는 사용량을 늘리지 않습니다.</footer>
</main></div>
<script>
/* BEGIN AI_USAGE_JS */
/* AI 사용량 화면의 공통 원본. build_ui.py로 각 배포본에 포함합니다.
 * 데이터 조회·DOM·인증에 의존하지 않는 표시 전용 renderer입니다. */
var AIUsageUI = (function () {
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function percent(value) {
    if (typeof value !== 'number' && typeof value !== 'string') return null;
    if (typeof value === 'string' && !value.trim()) return null;
    var p = Number(value);
    return isFinite(p) && p >= 0 ? p : null;
  }
  function tone(p) { return p === null ? 'unknown' : p >= 80 ? 'crit' : 'ok'; }
  function shortTime(s) {
    if (!s) return '';
    var time = Date.parse(s);
    if (isNaN(time)) return '';
    return new Date(time + 9 * 60 * 60 * 1000).toISOString().slice(5, 16).replace('T', ' ');
  }
  function mainIndex(limits) {
    var weekly = limits.findIndex(function (l) { return l.kind === 'weekly_all'; });
    if (weekly < 0) weekly = limits.findIndex(function (l) { return l.name === '주간'; });
    return weekly < 0 ? 0 : weekly;
  }
  function limitHtml(l, main) {
    var p = percent(l.percent), t = tone(p), reset = shortTime(l.resets_at);
    var status = p === null ? '확인 안 됨' : p >= 100 ? '한도 도달' : p >= 80 ? '사용량 높음' : '';
    var out = '<div class="aiu-limit ' + (main ? 'aiu-primary ' : 'aiu-secondary ') + 'aiu-state-' + t + '">';
    out += '<div class="aiu-limit-head"><span>' + esc(l.name || '사용 한도') + '</span>';
    if (main) {
      out += (status ? '<span class="aiu-status">' + status + '</span>' : '') + '</div>';
      out += '<div class="aiu-value">' + (p === null ? '—' : esc(p) + '<span>%</span>') + '</div>';
    } else {
      out += '<span class="aiu-small-value">' + (p === null ? '—' : esc(p) + '%') +
        (status ? '<span class="aiu-sr-only"> · ' + status + '</span>' : '') + '</span></div>';
    }
    if (p !== null) {
      out += '<div class="aiu-track" role="meter" aria-label="' + esc(l.name || '사용 한도') +
        '" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.min(p, 100) +
        '" aria-valuetext="' + esc(p) + '% ' + status + '"><i style="width:' + Math.min(p, 100) + '%"></i></div>';
    }
    out += '<div class="aiu-reset">' + (reset ? esc(reset) + ' 리셋' : '리셋 시각 미확인') + '</div></div>';
    return out;
  }
  function cards(data) {
    var slots = data && Array.isArray(data.slots) ? data.slots : [];
    var out = '<div class="aiu-section-head"><h2>현재 사용량</h2><span>계정별 구독 한도</span></div>';
    out += '<div class="aiu-groups">';
    ['telmon0001', 'dombom4483'].forEach(function (owner) {
      var accountSlots = slots.filter(function (s) { return s.owner === owner; });
      if (!accountSlots.length) return;
      out += '<section class="aiu-account" aria-label="' + esc(owner) + ' 계정">' +
        '<div class="aiu-account-head"><h3>' + (owner === 'telmon0001' ? '텔몬' : '돔봄') +
        '</h3><span class="aiu-owner">' + esc(owner) + '</span></div><div class="aiu-account-cards">';
      accountSlots.forEach(function (s) {
        out += '<article class="aiu-card"><div class="aiu-card-head"><h4>' + esc(s.tool_name || s.tool || '') +
          '</h4><span class="aiu-plan">' + esc(s.plan || '') + '</span></div>';
        if (!s.ok && !s.stale) {
          out += '<div class="aiu-missing">—</div><div class="aiu-err">조회 실패 — ' + esc(s.error || '다음 수집을 기다립니다') + '</div>';
        } else {
          if (s.stale) out += '<div class="aiu-stale">' + esc(s.stale_minutes == null ? '?' : s.stale_minutes) + '분 전 값입니다 · 현재 조회 실패</div>';
          var limits = Array.isArray(s.limits) ? s.limits : [];
          if (!limits.length) out += '<div class="aiu-missing">—</div><div class="aiu-empty">한도 정보가 없습니다</div>';
          else {
            var selected = mainIndex(limits);
            out += limitHtml(limits[selected], true);
            if (limits.length > 1) {
              out += '<div class="aiu-other-limits">';
              limits.forEach(function (l, i) { if (i !== selected) out += limitHtml(l, false); });
              out += '</div>';
            }
          }
        }
        out += '</article>';
      });
      out += '</div></section>';
    });
    out += '</div>';
    if (!slots.length) out += '<p class="aiu-empty">아직 수집된 값이 없습니다.</p>';
    return out + '<p class="aiu-legend">80%부터 빨강 · 리셋 시각은 한국 시간</p>';
  }
  function trend() {
    return '<details class="aiu-trend"><summary><span><strong>사용량 추이</strong>' +
      '<small>날짜와 시간대별 사용 패턴</small></span><span class="aiu-expand" aria-hidden="true"></span></summary>' +
      '<div class="aiu-trend-empty"><strong>아직 추이 데이터가 없습니다</strong>' +
      '<p>토큰 수집 연결 후 일별·시간별 사용량을 보여드립니다.</p>' +
      '<span>현재 한도 사용률과 소비 토큰은 서로 다른 지표입니다.</span></div></details>';
  }
  /* 테마 자동 전환(2026-09-22) — 서울 일출·일몰 기준. 허브·상황판이 같은 판정을 쓴다.
   * NOAA 근사식(오차 1-2분). 시각은 브라우저 시간대와 무관하게 UTC에서 KST(+9)로 만든다. */
  var SUN_LAT = 37.5665, SUN_LON = 126.9780, SUN_TZ_MIN = 540;
  function sunTimes(now) {
    // {rise, set}: 그날(KST) 일출·일몰을 KST 자정 기준 분으로. 극야·백야는 없다(서울).
    var kst = new Date(now.getTime() + SUN_TZ_MIN * 60000);
    var doy = Math.floor((Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate()) -
      Date.UTC(kst.getUTCFullYear(), 0, 1)) / 86400000) + 1;
    var g = 2 * Math.PI / 365 * (doy - 1);
    var eqtime = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) -
      0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
    var decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) +
      0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
    var lat = SUN_LAT * Math.PI / 180;
    var ha = Math.acos(Math.cos(90.833 * Math.PI / 180) / (Math.cos(lat) * Math.cos(decl)) -
      Math.tan(lat) * Math.tan(decl)) * 180 / Math.PI;
    function kstMin(utcMin) { return ((utcMin + SUN_TZ_MIN) % 1440 + 1440) % 1440; }
    return { rise: kstMin(720 - 4 * (SUN_LON + ha) - eqtime), set: kstMin(720 - 4 * (SUN_LON - ha) - eqtime) };
  }
  function autoDark(now) {
    // 지금(KST)이 일출 전이거나 일몰 후면 true. 계산이 안 되면 06-18시 규칙으로 물러선다.
    now = now || new Date();
    var m = (now.getUTCHours() * 60 + now.getUTCMinutes() + SUN_TZ_MIN) % 1440;
    try {
      var s = sunTimes(now);
      if (isFinite(s.rise) && isFinite(s.set) && s.rise < s.set) return m < s.rise || m >= s.set;
    } catch (e) { /* 아래 고정 규칙 */ }
    return m < 6 * 60 || m >= 18 * 60;
  }
  return { cards: cards, trend: trend, tone: tone, percent: percent, shortTime: shortTime,
           sunTimes: sunTimes, autoDark: autoDark };
})();
/* END AI_USAGE_JS */
// ── 설정 ─────────────────────────────────────────────────────────────
var DATA_URL = 'https://script.google.com/macros/s/AKfycbwZJh7CGtCfvuZ__rcN0M-kcAAm8KPC8mXM_uGg60fg8uzuKbvl9AgZfslV7BhM8KQTjg/exec?format=json';
var POLL_MS = 30000;          // 탭이 보일 때만 이 간격으로 다시 받는다
var LAG_MINUTES = 6;          // 기준이 이보다 낡으면 「수집 지연」(수집은 2분 주기)
var PROBE_URL = 'http://127.0.0.1:8765/report';   // ?probe=1 일 때만(다계정 자동 판정용)

var last = null;              // 마지막으로 받은 값 — 실패해도 지우지 않는다
var failed = false;
var inflight = false;
var firstDone = false;
var timer = null;

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function ageMinutes(iso) {
  var t = Date.parse(iso);
  return isNaN(t) ? null : Math.max(0, Math.floor((Date.now() - t) / 60000));
}

function renderMeta() {
  var meta = document.getElementById('meta');
  var fail = document.getElementById('fail');
  if (last && last.fetched_at) {
    var age = ageMinutes(last.fetched_at);
    var html = '기준 ' + esc(String(last.fetched_at).slice(11, 16)) +
               (age === null ? '' : ' · ' + age + '분 전');
    if (age !== null && age > LAG_MINUTES) html += '<span class="aiu-lag">수집 지연</span>';
    meta.innerHTML = html;
  } else if (last) {
    meta.textContent = '아직 수집된 값이 없습니다. 운영 PC 수집기가 한 번 보내면 표시됩니다.';
  }
  if (failed) {
    fail.textContent = last ? '갱신 실패 — 마지막 값 표시 중' : '갱신 실패 — 30초 뒤 다시 시도합니다';
    fail.hidden = false;
  } else {
    fail.hidden = true;
  }
}

function renderGroups() {
  if (last) document.getElementById('groups').innerHTML = AIUsageUI.cards(last);
}

function render() { renderMeta(); renderGroups(); }

/** ?probe=1 이면 첫 렌더 요약을 이 PC 의 시험 도구로 보낸다(주소 고정, 실패는 무시). */
function probe() {
  if (!/(^|[?&])probe=1(&|$)/.test(location.search.slice(1))) return;
  var body = JSON.stringify({ ok: !failed && !!last, fetched_at: last ? last.fetched_at : null,
                              slots: last && last.slots ? last.slots.length : 0 });
  try {
    fetch(PROBE_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: body })
      .catch(function () {});
  } catch (e) {}
}

function tick() {
  if (inflight) return;
  inflight = true;
  // ★credentials:'omit' — 구글 쿠키를 안 보내야 다계정 계정 돌리기(/u/N/ 404)를 안 탄다.
  fetch(DATA_URL, { credentials: 'omit', cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) {
      if (!d || !Array.isArray(d.slots)) throw new Error('형식이 다름');
      last = d;
      failed = false;
    })
    .catch(function () { failed = true; })
    .then(function () {
      inflight = false;
      render();
      if (!firstDone) { firstDone = true; probe(); }
    });
}

function schedule() {
  if (timer) { clearInterval(timer); timer = null; }
  if (document.visibilityState === 'visible') timer = setInterval(tick, POLL_MS);
}

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') tick();   // 다시 보이면 즉시 한 번
  schedule();
});

// 테마: 자동(서울 일출·일몰, AIUsageUI.autoDark)이 기본이다. 버튼을 누르면 그 값을
// 다음 자동 전환(일출/일몰)까지만 유지하고, 전환이 지나면 다시 자동으로 돌아간다.
// aiUsageTheme 는 마지막 적용값 캐시(첫 화면 깜빡임 방지용)이고 수동 여부는 aiUsageThemeOverride 가 든다.
function themeOverride() {
  try {
    var o = JSON.parse(localStorage.getItem('aiUsageThemeOverride') || 'null');
    if (o && typeof o.dark === 'boolean' && typeof o.base === 'boolean') return o;
  } catch (e) {}
  return null;
}
function applyTheme() {
  var auto = AIUsageUI.autoDark(), o = themeOverride(), dark = auto;
  if (o) {
    if (o.base === auto) dark = o.dark;
    else { try { localStorage.removeItem('aiUsageThemeOverride'); } catch (e) {} }
  }
  document.body.classList.toggle('dark', dark);
  try { localStorage.setItem('aiUsageTheme', dark ? 'dark' : 'light'); } catch (e) {}
  lb();
}
function tg() {
  var auto = AIUsageUI.autoDark(), dark = !document.body.classList.contains('dark');
  try {
    if (dark === auto) localStorage.removeItem('aiUsageThemeOverride');
    else localStorage.setItem('aiUsageThemeOverride', JSON.stringify({ dark: dark, base: auto }));
  } catch (e) {}
  applyTheme();
}
function lb() {
  var b = document.getElementById('tbtn');
  if (!b) return;
  var dark = document.body.classList.contains('dark');
  b.textContent = dark ? '라이트' : '다크';
  b.title = themeOverride() ? '수동 — 다음 일출·일몰에 자동으로 돌아갑니다' : '자동 — 서울 일출·일몰 기준';
}

applyTheme();
setInterval(applyTheme, 60000);   // 일출·일몰 경계를 1분 안에 따라간다
tick();
schedule();
</script>
